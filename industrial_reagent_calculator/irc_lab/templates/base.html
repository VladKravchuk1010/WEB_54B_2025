<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Промышленный калькулятор реагентов{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">
                    <a href="{% url 'chemical_processes' %}">Промышленный калькулятор реагентов</a>
                </h1>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <a href="{% url 'request_composition' %}" class="request-cart">
        <div class="cart-badge">2</div>
    </a>
</body>
</html>
